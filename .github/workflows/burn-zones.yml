name: Burn zones

on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'

permissions:
  contents: write

jobs:
  refresh-burn-zones:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate burn zone artifact
        run: node scripts/generate-burn-zones.js

      - name: Commit updated burn zones
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update burn zone data'
          file_pattern: data/burn-zones/latest.geojson
