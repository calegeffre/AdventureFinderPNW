<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PNW Powder Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <script src="https://unpkg.com/lucide@1.31.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="dist/adventurefinder.css" />
  <style>
    /* Page-specific: powder hero + resort cards */
    /* HERO IMAGE — swap this URL to use your own photo */
    .hero--snow {
      background-image: url('images/snow-hero.jpg');
    }

    main {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .resort-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .resort-card {
      background: color-mix(in srgb, var(--surface) 95%, transparent);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .resort-header { display: flex; align-items: center; gap: 0.6rem; }
    .resort-name { font-size: 1.1rem; font-weight: 700; color: var(--accent-strong); }
    .resort-elevation { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.1rem; }
    .days-row { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .day-cell {
      flex: 1;
      min-width: 48px;
      background: color-mix(in srgb, var(--border) 40%, transparent);
      border-radius: 8px;
      padding: 0.5rem 0.3rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
    }
    .day-cell.snowy {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .day-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .day-icon { width: 1.4rem; height: 1.4rem; color: var(--accent-strong); }
    .day-snow { font-size: 0.72rem; font-weight: 700; color: var(--accent-strong); }
    .day-snow.none { color: #475569; }
    .day-temp { font-size: 0.68rem; color: var(--text-muted); }
    .total-snow {
      font-size: 0.82rem;
      color: var(--color-soft);
      border-top: 1px solid var(--border);
      padding-top: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .total-snow strong { color: var(--accent-strong); font-size: 1rem; }
    .loading-card {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 1rem 0;
      animation: pulse-soft 1.5s ease-in-out infinite;
    }
    .error-msg {
      color: var(--color-danger);
      font-size: 0.82rem;
      text-align: center;
      padding: 0.5rem 0;
    }
    footer { margin-top: 2rem; }

    @media (max-width: 640px) {
      header { padding: 0.6rem 1rem; }
      h1 { font-size: 1.3rem; }
      .subtitle { font-size: 0.8rem; }
      main { margin: 1rem auto; }
    }
  </style>
</head>
<body data-theme="powder">
  <section class="hero hero--banner hero--snow">
    <nav class="nav">
      <a href="index.html" class="nav-brand"><i data-lucide="compass"></i> Adventure Finder</a>
      <div class="nav-links">
        <a href="sunshine.html" class="nav-hide"><i data-lucide="sun"></i> Sun</a>
        <a href="waves.html" class="nav-hide"><i data-lucide="waves"></i> Waves</a>
        <a href="index.html" class="btn btn-ghost">Home</a>
      </div>
    </nav>
    <div class="hero-inner">
      <div class="hero-kicker">Powder Finder</div>
      <h1 class="hero-title">Find the Snow</h1>
      <p class="hero-sub">7-day snowfall forecasts for Pacific Northwest ski resorts.</p>
      <div class="hero-actions">
        <a href="https://nwac.us/" class="btn btn-ghost" target="_blank" rel="noreferrer"><i data-lucide="triangle-alert"></i> NWAC Avalanche Forecast</a>
      </div>
    </div>
  </section>

  <main>
    <div class="resort-grid" id="resortGrid">
      <!-- Cards injected by JS -->
    </div>
  </main>

  <footer>
    Data from <a href="https://open-meteo.com/">Open-Meteo API</a> ·
    Updated: <span id="lastUpdated">-</span>
  </footer>

  <script>
    const resorts = [
      { name: 'Whistler Blackcomb', location: 'Whistler, BC', lat: 50.1163, lon: -122.9574, elevation: '7,160 ft summit', distFromSeattle: '280 mi' },
      { name: 'Stevens Pass',       location: 'Skykomish, WA', lat: 47.7448, lon: -121.0862, elevation: '5,845 ft summit', distFromSeattle: '85 mi' },
      { name: 'Crystal Mountain',   location: 'Greenwater, WA', lat: 46.9286, lon: -121.4744, elevation: '7,012 ft summit', distFromSeattle: '85 mi' },
      { name: 'Snoqualmie Pass',    location: 'Snoqualmie Pass, WA', lat: 47.4281, lon: -121.4116, elevation: '3,022 ft base', distFromSeattle: '50 mi' },
      { name: 'Mission Ridge',      location: 'Wenatchee, WA', lat: 47.2970, lon: -120.3920, elevation: '6,770 ft summit', distFromSeattle: '145 mi' },
      { name: 'Mt. Baker',          location: 'Deming, WA', lat: 48.8566, lon: -121.6647, elevation: '5,089 ft summit', distFromSeattle: '140 mi' },
      { name: 'White Pass',         location: 'Naches, WA', lat: 46.6370, lon: -121.3910, elevation: '6,500 ft summit', distFromSeattle: '145 mi' },
      { name: 'Mt. Bachelor',       location: 'Bend, OR', lat: 43.9792, lon: -121.6886, elevation: '9,065 ft summit', distFromSeattle: '330 mi' },
    ];

    // WMO weather code → Lucide icon/description
    const weatherIcons = {
      0:  { desc: 'Clear', icon: 'sun' },
      1:  { desc: 'Mainly Clear', icon: 'cloud-sun' },
      2:  { desc: 'Partly Cloudy', icon: 'cloud-sun' },
      3:  { desc: 'Overcast', icon: 'cloud' },
      45: { desc: 'Fog', icon: 'cloud-fog' },
      48: { desc: 'Icy Fog', icon: 'cloud-fog' },
      51: { desc: 'Light Drizzle', icon: 'cloud-drizzle' },
      53: { desc: 'Drizzle', icon: 'cloud-drizzle' },
      55: { desc: 'Heavy Drizzle', icon: 'cloud-rain' },
      61: { desc: 'Light Rain', icon: 'cloud-rain' },
      63: { desc: 'Rain', icon: 'cloud-rain' },
      65: { desc: 'Heavy Rain', icon: 'cloud-rain' },
      71: { desc: 'Light Snow', icon: 'cloud-snow' },
      73: { desc: 'Snow', icon: 'cloud-snow' },
      75: { desc: 'Heavy Snow', icon: 'cloud-snow' },
      77: { desc: 'Snow Grains', icon: 'cloud-snow' },
      80: { desc: 'Rain Showers', icon: 'cloud-drizzle' },
      81: { desc: 'Rain Showers', icon: 'cloud-rain' },
      82: { desc: 'Heavy Rain', icon: 'cloud-lightning' },
      85: { desc: 'Snow Showers', icon: 'cloud-snow' },
      86: { desc: 'Heavy Snow Showers', icon: 'cloud-snow' },
      95: { desc: 'Thunderstorm', icon: 'cloud-lightning' },
      96: { desc: 'Thunderstorm + Hail', icon: 'cloud-lightning' },
      99: { desc: 'Thunderstorm + Hail', icon: 'cloud-lightning' },
    };

    function cmToInches(cm) {
      return cm / 2.54;
    }

    function formatSnow(inches) {
      if (inches < 0.1) return null;
      return inches < 1 ? `${Math.trunc(inches * 10) / 10}"` : `${Math.round(inches)}"`;
    }

    function shortDayLabel(dateStr, index) {
      if (index === 0) return 'Today';
      if (index === 1) return 'Tmrw';
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('en-US', { weekday: 'short' });
    }

    async function fetchSnowForecast(resort) {
      const url = `https://api.open-meteo.com/v1/forecast` +
        `?latitude=${resort.lat}&longitude=${resort.lon}` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min,snowfall_sum` +
        `&temperature_unit=fahrenheit` +
        `&timezone=America%2FLos_Angeles` +
        `&forecast_days=7`;
      const res = await fetch(url);
      return res.json();
    }

    function buildCard(resort) {
      const card = document.createElement('div');
      card.className = 'resort-card';
      card.id = `card-${resort.name.replace(/\s+/g, '-')}`;
      card.innerHTML = `
        <div class="resort-header">
          <div>
            <div class="resort-name"><i data-lucide="mountain-snow" class="icon"></i> ${resort.name}</div>
            <div class="resort-elevation">${resort.location} · ${resort.elevation} · <i data-lucide="car" class="icon"></i> ${resort.distFromSeattle} from Seattle</div>
          </div>
        </div>
        <div class="loading-card">Loading forecast…</div>
      `;
      return card;
    }

    function populateCard(card, resort, data) {
      const daily = data.daily;
      const days = daily.time; // array of date strings

      let totalSnowIn = 0;
      const cells = days.map((dateStr, i) => {
        const code = daily.weather_code[i];
        const snowCm = daily.snowfall_sum[i] || 0;
        const snowIn = cmToInches(snowCm);
        totalSnowIn += snowIn;
        const snowLabel = formatSnow(snowIn);
        const icon = weatherIcons[code] || { desc: 'Unknown', icon: 'circle-help' };
        const hi = Math.round(daily.temperature_2m_max[i]);
        const lo = Math.round(daily.temperature_2m_min[i]);
        const isSnowy = snowIn >= 0.1;

        return `
          <div class="day-cell${isSnowy ? ' snowy' : ''}">
            <div class="day-label">${shortDayLabel(dateStr, i)}</div>
            <i data-lucide="${icon.icon}" class="day-icon"></i>
            <div class="day-snow${snowLabel ? '' : ' none'}">${snowLabel || '—'}</div>
            <div class="day-temp">${hi}°/${lo}°</div>
          </div>
        `;
      }).join('');

      const totalLabel = totalSnowIn >= 0.1
        ? `<strong>${Math.round(totalSnowIn * 10) / 10}"</strong> projected over 7 days`
        : `<span style="color:#475569">No significant snow expected</span>`;

      card.innerHTML = `
        <div class="resort-header">
          <div>
            <div class="resort-name"><i data-lucide="mountain-snow" class="icon"></i> ${resort.name}</div>
            <div class="resort-elevation">${resort.location} · ${resort.elevation} · <i data-lucide="car" class="icon"></i> ${resort.distFromSeattle} from Seattle</div>
          </div>
        </div>
        <div class="days-row">${cells}</div>
        <div class="total-snow"><i data-lucide="cloud-snow" class="icon"></i> 7-day total: ${totalLabel}</div>
      `;
      refreshIcons();
    }

    function refreshIcons() { if (window.lucide) lucide.createIcons(); }

    async function loadResort(resort, card) {
      try {
        const data = await fetchSnowForecast(resort);
        populateCard(card, resort, data);
      } catch (err) {
        console.error(`Failed to fetch data for ${resort.name}:`, err);
        card.querySelector('.loading-card')?.remove();
        const errEl = document.createElement('div');
        errEl.className = 'error-msg';
        errEl.textContent = 'Failed to load forecast.';
        card.appendChild(errEl);
      }
    }

    async function init() {
      const grid = document.getElementById('resortGrid');
      const cards = resorts.map(resort => {
        const card = buildCard(resort);
        grid.appendChild(card);
        return { resort, card };
      });

      await Promise.all(cards.map(({ resort, card }) => loadResort(resort, card)));
      document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
    }

    if (window.lucide) lucide.createIcons();
    init();
  </script>
</body>
</html>
