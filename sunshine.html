    // Broader set of cities polled when main + fallback still yield fewer than 3 sunny spots.

      // Washington State coast / east (beyond main + fallback lists)

      // Idaho (beyond Boise / Coeur d'Alene / Sandpoint)

      { name: 'Lewiston ID',        lat: 46.4165, lon: -117.0177 },

      // Montana (beyond Missoula)

      { name: 'Helena MT',          lat: 46.5958, lon: -112.0270 },

      // Alberta, Canada

      { name: 'Edmonton AB',        lat: 53.5461, lon: -113.4938 },
      // Northern California
      { name: 'Eureka CA',          lat: 40.8021, lon: -124.1637 },
      { name: 'Redding CA',         lat: 40.5865, lon: -122.3917 },
      // Nevada
      { name: 'Reno NV',            lat: 39.5296, lon: -119.8138 },
      // Central / Southern California
      { name: 'Sacramento CA',      lat: 38.5816, lon: -121.4944 },
      { name: 'San Francisco CA',   lat: 37.7749, lon: -122.4194 },
      { name: 'Los Angeles CA',     lat: 34.0522, lon: -118.2437 },
      { name: 'San Diego CA',       lat: 32.7157, lon: -117.1611 },
      // Intermountain West
      { name: 'Salt Lake City UT',  lat: 40.7608, lon: -111.8910 },
      { name: 'Las Vegas NV',       lat: 36.1699, lon: -115.1398 },
      { name: 'Phoenix AZ',         lat: 33.4484, lon: -112.0740 },
      { name: 'Denver CO',          lat: 39.7392, lon: -104.9903 },
    ];

    // Cache fetched fallback city data to avoid re-fetching on tab switches
    let fallbackCityCache = {};

    // Cache fetched expanded city data to avoid re-fetching on tab switches
    let expandedCityCache = {};

    // Haversine formula: straight-line distance in miles between two lat/lon points
    function distanceMiles(lat1, lon1, lat2, lon2) {
      const R = 3958.8; // Earth's mean radius in miles
      const toRad = x => x * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Returns true for WMO codes that qualify as "partly sunny or better" (codes 0, 1, 2)
    function isPartlySunnyOrBetter(code) {
      return code === 0 || code === 1 || code === 2;
    }

    // Daylight window used to evaluate the day's dominant weather pattern.
    const DAYLIGHT_START_HOUR = 7;  // 7 am (inclusive)
    const DAYLIGHT_END_HOUR   = 19; // 7 pm (exclusive)
    // Fraction of daylight hours that must be partly-sunny-or-better for a day
    // to be considered "sunny".  0.5 = majority required.
    const SUNNY_MAJORITY_THRESHOLD = 0.5;

    // Returns true if at least SUNNY_MAJORITY_THRESHOLD of daylight hours
    // (7 am-7 pm) for the given day have a partly-sunny-or-better code (0/1/2).
    // Falls back to the daily code when hourly data is unavailable.
    function hasSufficientSunshine(cityData, dayIndex) {
      if (cityData.hourlyData && cityData.hourlyData.weather_code) {
        const dayStart = dayIndex * 24;
        const codes = cityData.hourlyData.weather_code;
        let sunnyCount = 0;
        let totalDaylight = 0;
        for (let h = DAYLIGHT_START_HOUR; h < DAYLIGHT_END_HOUR; h++) {
          const i = dayStart + h;
          if (i >= codes.length) continue;
          totalDaylight++;
          if (isPartlySunnyOrBetter(codes[i])) sunnyCount++;
        }
        if (totalDaylight === 0) {
          return cityData.dailyData && isPartlySunnyOrBetter(cityData.dailyData.weather_code[dayIndex]);
        }
        return sunnyCount / totalDaylight >= SUNNY_MAJORITY_THRESHOLD;
      }
      // Fallback: use daily code
      return cityData.dailyData && isPartlySunnyOrBetter(cityData.dailyData.weather_code[dayIndex]);
    }

    // Returns the dominant (most frequent) hourly weather code during daylight
    // hours (7 am-7 pm) for the given day, or the daily code as fallback.
    // Ties are broken by preferring the lower (sunnier) code.
    function dominantDaylightCode(cityData, dayIndex) {
      if (cityData.hourlyData && cityData.hourlyData.weather_code) {
        const dayStart = dayIndex * 24;
        const codes = cityData.hourlyData.weather_code;
        const freq = {};
        for (let h = DAYLIGHT_START_HOUR; h < DAYLIGHT_END_HOUR; h++) {
          const i = dayStart + h;
          if (i >= codes.length) continue;
          freq[codes[i]] = (freq[codes[i]] || 0) + 1;
        }
        const entries = Object.entries(freq);
        if (entries.length > 0) {
          entries.sort((a, b) => b[1] - a[1] || Number(a[0]) - Number(b[0]));
          return parseInt(entries[0][0], 10);
        }
      }
      return cityData.dailyData ? cityData.dailyData.weather_code[dayIndex] : null;
    }

    function getAqiForDay(cityData, dayIndex) {
      if (!cityData.aqiHourly || !Array.isArray(cityData.aqiHourly)) return null;
      const startHour = dayIndex * 24;
      const endHour = startHour + 24;
      const dayAqiValues = cityData.aqiHourly
        .slice(startHour, endHour)
        .filter(value => Number.isFinite(value));

      if (dayAqiValues.length === 0) return null;
      return Math.round(Math.max(...dayAqiValues));
    }

    function getAqiCategory(aqi) {
      if (!Number.isFinite(aqi)) return { className: 'aqi-unknown', label: 'Unknown' };
      if (aqi <= 50) return { className: 'aqi-good', label: 'Good' };
      if (aqi <= 100) return { className: 'aqi-moderate', label: 'Moderate' };
      if (aqi <= 150) return { className: 'aqi-usg', label: 'Unhealthy for Sensitive Groups' };
      if (aqi <= 200) return { className: 'aqi-unhealthy', label: 'Unhealthy' };
      if (aqi <= 300) return { className: 'aqi-very-unhealthy', label: 'Very Unhealthy' };
      return { className: 'aqi-hazardous', label: 'Hazardous' };
    }

    function getSunHoursForDay(cityData, dayIndex) {
      if (!cityData.dailyData || !Array.isArray(cityData.dailyData.sunshine_duration)) {
        return null;
      }
      const seconds = Number(cityData.dailyData.sunshine_duration[dayIndex]);
      return Number.isFinite(seconds) ? seconds / 3600 : null;
    }

    function formatSunHours(hours) {
      if (!Number.isFinite(Number(hours))) return 'Sun data unavailable';
      return `${Number(hours).toFixed(1)} hr sun`;
    }

    // Track current markers and selected day
    let markers = [];

    // Calculate days needed for forecast (up to next Sunday)
    function calculateForecastDays() {
      const today = new Date();
      const dayOfWeek = today.getDay(); // 0 = Sunday, 6 = Saturday
      
      // Days until next Saturday/Sunday
      // If today is already Sat or Sun, show NEXT week's weekend
      let daysToSat, daysToSun;
      if (dayOfWeek === 6) {
        // Today is Saturday - show next Saturday (7 days) and next Sunday (8 days)
        daysToSat = 7;
        daysToSun = 8;
      } else if (dayOfWeek === 0) {
        // Today is Sunday - show next Saturday (6 days) and next Sunday (7 days)
        daysToSat = 6;
        daysToSun = 7;
      } else {
        // Mon-Fri - show this coming Saturday and Sunday
        daysToSat = 6 - dayOfWeek;
        daysToSun = 7 - dayOfWeek;
      }
      
      return {
        daysToSat,
        daysToSun,
        forecastDaysNeeded: Math.max(daysToSun + 1, 2) // At least 2 for today/tomorrow
      };
    }
    
    // Format date labels for tabs
    function updateTabLabels() {
      const today = new Date();
      const { daysToSat, daysToSun } = calculateForecastDays();
      
      const satDate = new Date(today);
      satDate.setDate(today.getDate() + daysToSat);
      
      const sunDate = new Date(today);
      sunDate.setDate(today.getDate() + daysToSun);
      
      const formatDate = (date) => {
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      };
      
      document.getElementById('satTab').textContent = `Saturday ${formatDate(satDate)}`;
      document.getElementById('satTab').dataset.dayIndex = daysToSat;
      
      document.getElementById('sunTab').textContent = `Sunday ${formatDate(sunDate)}`;
      document.getElementById('sunTab').dataset.dayIndex = daysToSun;
    }

    // Initialize map centered on PNW
    const map = L.map('map').setView([47.5, -121.5], 7);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    function refreshIcons() { if (window.lucide) lucide.createIcons(); }
    map.on('popupopen', refreshIcons);

    // Add legend
    const legend = L.control({ position: 'topright' });
    legend.onAdd = function() {
      const div = L.DomUtil.create('div', 'legend');
      const isMobile = window.matchMedia(MOBILE_BREAKPOINT).matches;
      div.innerHTML = `
        <div class="panel-header">
          <h4>Weather</h4><span class="panel-toggle"><i data-lucide="chevron-down"></i></span>
        </div>
        <div class="panel-body">
          <div class="legend-item"><i data-lucide="sun" class="legend-icon"></i> Clear/Sunny</div>
          <div class="legend-item"><i data-lucide="cloud-sun" class="legend-icon"></i> Mainly Clear</div>
          <div class="legend-item"><i data-lucide="cloud-sun" class="legend-icon"></i> Partly Cloudy</div>
          <div class="legend-item"><i data-lucide="cloud" class="legend-icon"></i> Cloudy</div>
          <div class="legend-item"><i data-lucide="cloud-rain" class="legend-icon"></i> Rain</div>
          <div class="legend-item"><i data-lucide="cloud-snow" class="legend-icon"></i> Snow</div>
          <div class="legend-item"><i data-lucide="flame" class="legend-icon"></i> Active Fire</div>
          <div class="legend-toggle">
            <label><input type="checkbox" id="toggleFires"> Show fires</label>
          </div>
          <div class="legend-toggle">
            <label><input type="checkbox" id="toggleAqi"> Show AQI</label>
          </div>
        </div>
      `;
      if (isMobile) div.classList.add('panel-collapsed');
      L.DomEvent.on(div.querySelector('.panel-header'), 'click', function() {
        div.classList.toggle('panel-collapsed');
      });
      return div;
    };
    legend.addTo(map);

    // Top 3 Closest Sunshine panel (topleft)
    const top3Control = L.control({ position: 'topleft' });
    top3Control.onAdd = function() {
      const div = L.DomUtil.create('div', 'top3-panel');
      const isMobile = window.matchMedia(MOBILE_BREAKPOINT).matches;
      div.innerHTML = `
        <div class="panel-header">
          <h4><i data-lucide="trophy" class="icon"></i> 3 Closest Sunny Spots</h4><span class="panel-toggle"><i data-lucide="chevron-down"></i></span>
        </div>
        <div class="panel-body">
          <div id="top3Content"><div class="top3-none">Loading...</div></div>
        </div>
      `;
      if (isMobile) div.classList.add('panel-collapsed');
      L.DomEvent.on(div.querySelector('.panel-header'), 'click', function() {
        div.classList.toggle('panel-collapsed');
      });
      return div;
    };
    top3Control.addTo(map);

    // Update the Top 3 Closest Sunshine panel for the given day
    async function updateTop3Panel(dayIndex) {
      const panel = document.getElementById('top3Content');
      if (!panel) return;

      panel.innerHTML = '<div class="top3-none">Searching...</div>';

      const { forecastDaysNeeded } = calculateForecastDays();

      // Collect qualifying spots from the already-fetched main cities
      const qualifying = allCityData
        .filter(c => c.dailyData && hasSufficientSunshine(c, dayIndex))
        .map(c => ({
          name: c.name,
          lat: c.lat,
          lon: c.lon,
          weatherCode: dominantDaylightCode(c, dayIndex),
          distance: distanceMiles(SEATTLE_LAT, SEATTLE_LON, c.lat, c.lon),
          aqi: getAqiForDay(c, dayIndex),
          sunHours: getSunHoursForDay(c, dayIndex)
        }))
        .sort((a, b) => a.distance - b.distance);

      let top3 = qualifying.slice(0, 3);

      // If fewer than 3 found, expand search to fallback outdoor-hub cities
      if (top3.length < 3) {
        const alreadyFetched = new Set(allCityData.map(c => c.name));
        const fallbacksSorted = fallbackCities
          .filter(c => !alreadyFetched.has(c.name))
          .map(c => ({ ...c, distance: distanceMiles(SEATTLE_LAT, SEATTLE_LON, c.lat, c.lon) }))
          .sort((a, b) => a.distance - b.distance);

        for (const city of fallbacksSorted) {
          if (top3.length >= 3) break;

          // Use cached result if available
          let cityData = fallbackCityCache[city.name];
          if (!cityData) {
            cityData = await fetchWeatherForCity(city, forecastDaysNeeded);
            fallbackCityCache[city.name] = cityData;
          }

          if (hasSufficientSunshine(cityData, dayIndex)) {
            top3.push({
              name: city.name,
              lat: city.lat,
              lon: city.lon,
              weatherCode: dominantDaylightCode(cityData, dayIndex),
              distance: city.distance,
              aqi: getAqiForDay(cityData, dayIndex),
              sunHours: getSunHoursForDay(cityData, dayIndex)
            });
          }
        }
      }

      // If still fewer than 3, search progressively farther cities at expanding distances
      if (top3.length < 3) {
        const alreadySearched = new Set([
          ...allCityData.map(c => c.name),
          ...Object.keys(fallbackCityCache),
        ]);
        const expandedSorted = expandedCities
          .filter(c => !alreadySearched.has(c.name))
          .map(c => ({ ...c, distance: distanceMiles(SEATTLE_LAT, SEATTLE_LON, c.lat, c.lon) }))
          .sort((a, b) => a.distance - b.distance);

        if (expandedSorted.length > 0) {
          panel.innerHTML = '<div class="top3-none">Searching further out...</div>';
        }

        for (const city of expandedSorted) {
          if (top3.length >= 3) break;

          let cityData = expandedCityCache[city.name];
          if (!cityData) {
            cityData = await fetchWeatherForCity(city, forecastDaysNeeded);
            expandedCityCache[city.name] = cityData;
          }

          if (hasSufficientSunshine(cityData, dayIndex)) {
            top3.push({
              name: city.name,
              lat: city.lat,
              lon: city.lon,
              weatherCode: dominantDaylightCode(cityData, dayIndex),
              distance: city.distance,
              aqi: getAqiForDay(cityData, dayIndex),
              sunHours: getSunHoursForDay(cityData, dayIndex)
            });
          }
        }
      }

      // Sort by distance so medals always reflect true proximity to Seattle
      top3.sort((a, b) => a.distance - b.distance);

      if (top3.length === 0) {
        panel.innerHTML = '<div class="top3-none">No sunny spots found <i data-lucide="cloud-off" class="icon"></i></div>';
        return;
      }

      const medals = ['<i data-lucide="medal" class="top3-medal medal-1"></i>', '<i data-lucide="medal" class="top3-medal medal-2"></i>', '<i data-lucide="medal" class="top3-medal medal-3"></i>'];
      panel.innerHTML = top3.map((city, i) => {
        const weather = weatherCodes[city.weatherCode] || UNKNOWN_WEATHER;
        const aqiMeta = getAqiCategory(city.aqi);
        const aqiDisplay = showAqi && city.aqi !== null
          ? `<span class="top3-aqi ${aqiMeta.className}" title="AQI ${city.aqi} (${aqiMeta.label})">${city.aqi}</span>`
          : '';
        const sunText = formatSunHours(city.sunHours);
        return `
          <div class="top3-item">
            <span class="top3-rank">${medals[i]}</span>
            <i data-lucide="${weather.icon}" class="top3-icon"></i>
            ${aqiDisplay}
            <div class="top3-info">
              <div class="top3-city">${city.name}</div>
              <div class="top3-dist">${Math.round(city.distance)} mi from Seattle</div>
              <div class="top3-sun">${sunText}</div>
            </div>
          </div>
        `;
      }).join('');
      refreshIcons();
    }

    // Create custom emoji marker
    function createEmojiIcon(iconName, isSunny, aqi) {
      const aqiMeta = getAqiCategory(aqi);
      const aqiMarkup = aqi !== null
        ? `<span class="marker-aqi ${aqiMeta.className}" title="AQI ${aqi} (${aqiMeta.label})">${aqi}</span>`
        : '';
      return L.divIcon({
        html: `<div class="marker-wrap"><i data-lucide="${iconName}" class="marker-icon${isSunny ? ' marker-sunny' : ''}"></i>${aqiMarkup}</div>`,
        className: 'emoji-marker',
        iconSize: [74, 40],
        iconAnchor: [20, 20],
        popupAnchor: [0, -20]
      });
    }

    function createFireIcon() {
      return L.divIcon({
        html: `<i data-lucide="flame" class="marker-icon marker-fire"></i>`,
        className: 'fire-marker',
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -12]
      });
    }

    function clearFireMarkers() {
      fireMarkers.forEach(marker => map.removeLayer(marker));
      fireMarkers = [];
    }

    function renderFireMarkers() {
      clearFireMarkers();
      if (!showFires) return;

      activeFireData.forEach(fire => {
        const marker = L.marker([fire.lat, fire.lon], { icon: createFireIcon() }).addTo(map);
        const updatedAt = fire.lastSeen ? new Date(fire.lastSeen).toLocaleString() : 'Unknown';
        marker.bindPopup(`
          <div class="city-popup">
            <h3>${fire.title}</h3>
            <div class="conditions"><i data-lucide="flame" class="icon"></i> Active wildfire</div>
            <div class="temp">Updated: ${updatedAt}</div>
          </div>
        `);
        fireMarkers.push(marker);
      });
      refreshIcons();
    }

    function isInFireSearchBounds(lat, lon) {
      return (
        lat >= FIRE_SEARCH_BOUNDS.minLat &&
        lat <= FIRE_SEARCH_BOUNDS.maxLat &&
        lon >= FIRE_SEARCH_BOUNDS.minLon &&
        lon <= FIRE_SEARCH_BOUNDS.maxLon
      );
    }

    function getLatestFirePoint(geometry) {
      if (!Array.isArray(geometry)) return null;
      const points = geometry.filter(item =>
        item &&
        item.type === 'Point' &&
        Array.isArray(item.coordinates) &&
        item.coordinates.length >= 2
      );
      if (points.length === 0) return null;

      points.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
      return points[0];
    }

    async function fetchActiveFires() {
      const firesUrl = 'https://eonet.gsfc.nasa.gov/api/v3/events?status=open&category=wildfires&limit=250';
      try {
        const response = await fetch(firesUrl);
        if (!response.ok) {
          throw new Error(`Status ${response.status}`);
        }
        const data = await response.json();
        const events = Array.isArray(data.events) ? data.events : [];

        activeFireData = events
          .map(event => {
            const latestPoint = getLatestFirePoint(event.geometry);
            if (!latestPoint) return null;
            const lon = latestPoint.coordinates[0];
            const lat = latestPoint.coordinates[1];
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
            if (!isInFireSearchBounds(lat, lon)) return null;

            return {
              id: event.id,
              title: event.title || 'Active wildfire',
              lat,
              lon,
              lastSeen: latestPoint.date || null,
            };
          })
          .filter(Boolean)
          .sort((a, b) => distanceMiles(SEATTLE_LAT, SEATTLE_LON, a.lat, a.lon) - distanceMiles(SEATTLE_LAT, SEATTLE_LON, b.lat, b.lon))
          .slice(0, 40);
      } catch (error) {
        console.error('Failed to fetch active wildfires:', error);
        activeFireData = [];
      }
    }

    async function fetchWeatherForCity(city, forecastDays) {
      const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,sunshine_duration&hourly=weather_code&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FLos_Angeles&forecast_days=${forecastDays}`;
      const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${city.lat}&longitude=${city.lon}&hourly=us_aqi&timezone=America%2FLos_Angeles&forecast_days=${forecastDays}`;
      
      try {
        const response = await fetch(weatherUrl);
        if (!response.ok) {
          throw new Error(`Status ${response.status}`);
        }
        const data = await response.json();
        let aqiHourly = null;

        try {
          const aqiResponse = await fetch(aqiUrl);
          if (!aqiResponse.ok) {
            throw new Error(`Status ${aqiResponse.status}`);
          }
          const aqiData = await aqiResponse.json();
          aqiHourly = aqiData.hourly && Array.isArray(aqiData.hourly.us_aqi)
            ? aqiData.hourly.us_aqi
            : null;
        } catch (aqiError) {
          console.error(`Failed to fetch AQI for ${city.name}:`, aqiError);
        }
        
        return {
          ...city,
          dailyData: data.daily,
          hourlyData: data.hourly || null,
          aqiHourly,
          currentTemp: Math.round(data.current.temperature_2m)
        };
      } catch (error) {
        console.error(`Failed to fetch weather for ${city.name}:`, error);
        return {
          ...city,
          dailyData: null,
          hourlyData: null,
          aqiHourly: null,
          currentTemp: '--'
        };
      }
    }
    
    function getWeatherForDay(cityData, dayIndex) {
      if (!cityData.dailyData || cityData.dailyData.weather_code[dayIndex] === undefined) {
        return {
          weather: { desc: 'Unavailable', sunny: false, icon: 'circle-help' },
          highTemp: '--',
          lowTemp: '--',
          isSunny: false
        };
      }
      
      const weatherCode = dominantDaylightCode(cityData, dayIndex) ?? cityData.dailyData.weather_code[dayIndex];
      const weather = weatherCodes[weatherCode] || UNKNOWN_WEATHER;
      
      return {
        weather,
        highTemp: Math.round(cityData.dailyData.temperature_2m_max[dayIndex]),
        lowTemp: Math.round(cityData.dailyData.temperature_2m_min[dayIndex]),
        isSunny: hasSufficientSunshine(cityData, dayIndex)
      };
    }
    
    // Store fetched data globally
    let allCityData = [];
    
    function clearMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }
    
    function displayWeatherForDay(dayIndex) {
      clearMarkers();
      selectedDayIndex = dayIndex;
      
      const isToday = dayIndex === 0;
      
      allCityData.forEach(cityData => {
        const dayWeather = getWeatherForDay(cityData, dayIndex);
        const aqiValue = getAqiForDay(cityData, dayIndex);
        const icon = createEmojiIcon(dayWeather.weather.icon, dayWeather.isSunny, showAqi ? aqiValue : null);
        const marker = L.marker([cityData.lat, cityData.lon], { icon }).addTo(map);
        
        const tempDisplay = isToday 
          ? `Currently: ${cityData.currentTemp}°F<br>High: ${dayWeather.highTemp}°F / Low: ${dayWeather.lowTemp}°F`
          : `High: ${dayWeather.highTemp}°F / Low: ${dayWeather.lowTemp}°F`;
        const aqiMeta = getAqiCategory(aqiValue);
        const aqiDisplay = showAqi && aqiValue !== null
          ? `<div class="conditions">AQI: <span class="popup-aqi ${aqiMeta.className}">${aqiValue}</span> ${aqiMeta.label}</div>`
          : '';
        
        marker.bindPopup(`
          <div class="city-popup">
            <h3>${cityData.name}</h3>
            <i data-lucide="${dayWeather.weather.icon}" class="weather-icon"></i>
            <div class="conditions">${dayWeather.weather.desc}</div>
            ${aqiDisplay}
            <div class="temp">${tempDisplay}</div>
            ${dayWeather.isSunny ? '<p style="color: var(--color-sun-ink); font-weight: bold; margin-top: 0.5rem;"><i data-lucide=\'sun\' class="icon"></i> Sunny!</p>' : ''}
          </div>
        `);
        
        markers.push(marker);
      });
      
      refreshIcons();
      // Log sunny cities
      const sunnyCities = allCityData.filter(c => getWeatherForDay(c, dayIndex).isSunny);
      console.log(`Sunny cities for day ${dayIndex}:`, sunnyCities.map(c => c.name).join(', ') || 'None');
    }

    async function updateAllWeather() {
      const loading = document.getElementById('loading');
      loading.classList.remove('hidden');
      
      const { forecastDaysNeeded } = calculateForecastDays();
      
      // Clear fallback cache on each refresh so data stays fresh
      fallbackCityCache = {};
      expandedCityCache = {};

      // Fetch all city weather in parallel
      const weatherPromises = cities.map(city => fetchWeatherForCity(city, forecastDaysNeeded));
      allCityData = await Promise.all(weatherPromises);
      
      // Display weather for currently selected day
      displayWeatherForDay(selectedDayIndex);
      
      // Update timestamp
      document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
      
      loading.classList.add('hidden');

      // Update Top 3 panel asynchronously (may fetch additional fallback data)
      updateTop3Panel(selectedDayIndex);

      if (showFires) {
        await fetchActiveFires();
        renderFireMarkers();
      }
    }
    
    // Tab click handlers
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        let dayIndex;
        const dayAttr = tab.dataset.day;
        
        if (dayAttr === 'sat') {
          dayIndex = parseInt(tab.dataset.dayIndex);
        } else if (dayAttr === 'sun') {
          dayIndex = parseInt(tab.dataset.dayIndex);
        } else {
          dayIndex = parseInt(dayAttr);
        }
        
        displayWeatherForDay(dayIndex);
        updateTop3Panel(dayIndex);
      });
    });

    const firesToggle = document.getElementById('toggleFires');
    const aqiToggle = document.getElementById('toggleAqi');

    if (firesToggle) {
      showFires = firesToggle.checked;
      firesToggle.addEventListener('change', async () => {
        showFires = firesToggle.checked;
        if (showFires && activeFireData.length === 0) {
          await fetchActiveFires();
        }
        renderFireMarkers();
      });
    }

    if (aqiToggle) {
      showAqi = aqiToggle.checked;
      aqiToggle.addEventListener('change', () => {
        showAqi = aqiToggle.checked;
        displayWeatherForDay(selectedDayIndex);
        updateTop3Panel(selectedDayIndex);
      });
    }

    // Initialize
    if (window.lucide) lucide.createIcons();  // upgrade static header/spinner icons
    updateTabLabels();
    updateAllWeather();
    
    // Refresh every 15 minutes
    setInterval(updateAllWeather, 15 * 60 * 1000);
  </script>
</body>
</html>
